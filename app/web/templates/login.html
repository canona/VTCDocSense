{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="panel" style="max-width:380px;margin:60px auto">
  <h1>Đăng nhập (chế độ dev)</h1>
  <p class="muted">Chỉ dùng khi chạy local (<code>AUTH_MODE=dev</code>). Production đăng nhập qua Cloudflare Access.</p>
  <form method="post" action="/login">
    <label>Email<br><input type="email" name="email" required autofocus></label>
    <p><button class="primary" type="submit">Đăng nhập</button></p>
  </form>
</div>
{% endblock %}
